<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Attendance Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#2D1B4E;
    --brand-dark:#1F132F;
    --brand-light:#3D2B5E;
    --accent-gold:#D4AF37;
    --ok:#118a0a; --warn:#d97706; --err:#b91c1c;
    --checkout:#dc2626; --checkout-dark:#b91c1c;
  }
  
  *{box-sizing:border-box;}
  
  body{
    margin:0;color:#111;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(135deg,#2D1B4E 0%,#3D2B5E 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  
  .wrap{
    width:100%;
    max-width:600px;
  }
  
  .card{
    background:#fff;
    border-radius:16px;
    padding:28px 20px;
    box-shadow:0 18px 40px rgba(0,0,0,.25);
    border-top:4px solid var(--accent-gold);
  }
  
  h1{
    margin:0 0 10px;
    font-size:26px;
    text-align:center;
    background:linear-gradient(90deg,#2D1B4E,#3D2B5E);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    font-family:'Playfair Display',Georgia,serif;
    font-weight:800;
    letter-spacing:0.5px;
    line-height:1.2;
  }
  
  .muted{
    color:#555;
    font-size:13px;
    margin:0 0 20px;
    text-align:center;
    line-height:1.4;
  }
  
  label{
    display:block;
    margin:16px 0 8px;
    font-weight:600;
    color:#2D1B4E;
    font-family:'Playfair Display',Georgia,serif;
    font-size:15px;
  }
  
  label:first-of-type{
    margin-top:0;
  }
  
  input,select,button{
    width:100%;
    padding:14px 16px;
    border:1px solid #d8dee9;
    border-radius:12px;
    background:#fff;
    font-size:16px;
    -webkit-appearance:none;
    appearance:none;
  }
  
  input:focus,select:focus{
    outline:none;
    border-color:var(--brand);
    box-shadow:0 0 0 4px rgba(45,27,78,.12);
  }
  
  button{
    border:none;
    font-weight:700;
    cursor:pointer;
    transition:all .2s ease;
    font-size:16px;
    padding:16px 14px;
    font-family:'Playfair Display',Georgia,serif;
    letter-spacing:0.5px;
    min-height:50px;
    -webkit-tap-highlight-color:transparent;
  }
  
  button:active{
    transform:scale(0.98);
  }
  
  button[disabled]{
    background:#c4b8d3;
    cursor:not-allowed;
    color:#fff;
  }
  
  /* Button Row Container */
  .button-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:24px;
  }
  
  /* Check In Button */
  .btn-checkin{
    background:var(--brand);
    color:#fff;
  }
  
  .btn-checkin:hover:not([disabled]){
    background:var(--brand-dark);
  }
  
  .btn-checkin:active:not([disabled]){
    background:var(--brand-dark);
  }
  
  /* Check Out Button */
  .btn-checkout{
    background:var(--checkout);
    color:#fff;
  }
  
  .btn-checkout:hover:not([disabled]){
    background:var(--checkout-dark);
  }
  
  .btn-checkout:active:not([disabled]){
    background:var(--checkout-dark);
  }
  
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  
  .msg{
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    font-size:14px;
    display:none;
    line-height:1.5;
  }
  
  .msg.ok{
    display:block;
    background:#ecfdf5;
    color:var(--ok);
    border:1px solid #bbf7d0;
  }
  
  .msg.warn{
    display:block;
    background:#fffbeb;
    color:var(--warn);
    border:1px solid #fde68a;
  }
  
  .msg.err{
    display:block;
    background:#fef2f2;
    color:var(--err);
    border:1px solid #fecaca;
  }
  
  .msg.info{
    display:block;
    background:#eff6ff;
    color:#2563eb;
    border:1px solid #bfdbfe;
  }
  
  .footer{
    text-align:center;
    margin-top:20px;
    color:#6b7280;
    font-size:11px;
    font-family:'Playfair Display',Georgia,serif;
    letter-spacing:0.5px;
  }
  
  /* Session Info Display */
  .session-info{
    background:#f8f9fa;
    border-radius:12px;
    padding:16px;
    margin-top:16px;
    display:none;
    border-left:4px solid var(--accent-gold);
  }
  
  .session-info.active{
    display:block;
  }
  
  .session-header{
    font-weight:700;
    color:var(--brand);
    margin-bottom:12px;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Playfair Display',Georgia,serif;
  }
  
  .status-badge{
    display:inline-block;
    background:var(--accent-gold);
    color:#2D1B4E;
    padding:4px 10px;
    border-radius:12px;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  
  .session-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:13px;
    gap:8px;
  }
  
  .session-label{
    color:#6b7280;
  }
  
  .session-value{
    font-weight:600;
    color:#2D1B4E;
    font-family:'Playfair Display',Georgia,serif;
    text-align:right;
  }
  
  .time-display{
    text-align:center;
    font-size:32px;
    font-weight:800;
    color:var(--brand);
    margin:12px 0 0;
    font-variant-numeric:tabular-nums;
    letter-spacing:-1px;
    font-family:'Playfair Display',Georgia,serif;
  }
  
  /* Mobile Optimizations */
  @media (max-width: 480px) {
    body{
      padding:12px;
      align-items:flex-start;
      padding-top:20px;
    }
    
    .card{
      padding:24px 18px;
      border-radius:12px;
    }
    
    h1{
      font-size:24px;
      margin-bottom:8px;
    }
    
    .muted{
      font-size:12px;
    }
    
    .row{
      grid-template-columns:1fr;
      gap:0;
    }
    
    .button-row{
      gap:10px;
    }
    
    button{
      font-size:15px;
      padding:15px 12px;
    }
    
    .time-display{
      font-size:28px;
    }
    
    .session-row{
      font-size:12px;
    }
    
    label{
      font-size:14px;
      margin:14px 0 6px;
    }
  }
  
  /* Very small screens */
  @media (max-width: 360px) {
    .button-row{
      grid-template-columns:1fr;
      gap:10px;
    }
    
    h1{
      font-size:22px;
    }
  }
  
  /* Landscape mobile */
  @media (max-width: 767px) and (orientation: landscape) {
    body{
      padding:12px;
      align-items:flex-start;
    }
    
    .card{
      padding:20px 18px;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Attendance Monitoring</h1>
      <p class="muted">Please enable location. Location access is limited to campus verification only.</p>

      <form onsubmit="return false;">
        <label for="studentId">Contact ID</label>
        <input id="studentId" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 13579666 - as per your Axcelerate profile" required autofocus />

        <label for="name">Full Name</label>
        <input id="name" placeholder="e.g. Wilson So" required />

        <div class="row">
          <div>
            <label for="trainer">Trainer</label>
            <select id="trainer" required>
              <option value="">— Select trainer —</option>
            </select>
          </div>
          <div>
            <label for="course">Course</label>
            <select id="course" required>
              <option value="">— Select course —</option>
            </select>
          </div>
        </div>

        <!-- Side by Side Buttons -->
        <div class="button-row">
          <button type="button" id="btnCheckIn" class="btn-checkin" disabled onclick="submitCheckIn()">
            ➜ Check In
          </button>
          <button type="button" id="btnCheckOut" class="btn-checkout" disabled onclick="submitCheckOut()">
            ✓ Check Out
          </button>
        </div>
      </form>

      <!-- Session Info Panel -->
      <div id="sessionInfo" class="session-info">
        <div class="session-header">
          <span class="status-badge">Active Session</span>
        </div>
        <div class="session-row">
          <span class="session-label">Checked in at:</span>
          <span class="session-value" id="sessionCheckIn">-</span>
        </div>
        <div class="session-row">
          <span class="session-label">Campus:</span>
          <span class="session-value" id="sessionCampus">-</span>
        </div>
        <div class="time-display" id="timeElapsed">00:00:00</div>
      </div>

      <div id="msg" class="msg"></div>
      <div class="footer">© Attendance Monitoring by NIET Group</div>
    </div>
  </div>

<script>
/* CONFIG */
const CHECKIN_FLOW_URL = "https://default9d8868a5c1dc4786aff1f7d04646be.9a.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9ed041ac7ca143a0b262334d9dfc13d5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=il-cX-qHDZbGSxE2OnN56BK2jdJIgxWXFIStUm65G6g";
const CHECKOUT_FLOW_URL = "https://default9d8868a5c1dc4786aff1f7d04646be.9a.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2e4266def4fe44618e9eddd28221178c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=NfMkFq1ITZSPcQNVmn6Ikt7OPS0NUA_Yp-Q9QP8TFoQ"
const ID_REGEX = /^[0-9]{8,}$/;

/* All available courses */
const ALL_COURSES = [

/* Trainers and their courses */
const TRAINER_COURSES = {
  "Carlos Castellano": ["SIT30821 Certificate III in Commercial Cookery"],
  "Carol Ly": ["CHC43015 Certificate IV in Ageing Support", "CHC52021 Diploma of Community Services"],
  "Chloe BIAN": ["CHC30121 Certificate III in Early Childhood Education and Care", "CHC50121 Diploma of Early Childhood Education and Care"],

};

/* Campus boundaries */
const campuses = [
  {
    name:"Brisbane Campus 102 Adelaide Street",
    coords:{lat:-27.468069512085428, lng:153.02471942376695},
    radius:0.3
  },
  {
    name:"Brisbane Campus 316 Adelaide Street",
    coords:{lat:-27.465055267670685, lng:153.02871827605486},
    radius:0.3
  },
  {
    name:"Gold Coast Campus",
    coords:{lat:-27.945401908916576, lng:153.41147360207012},
    radius:0.3
  },
  {
    name:"Hobart Campus",
    coords:{lat:-42.884889723708625, lng:147.32545454150238},
    radius:0.3
  }
];

/* GPS */
let gpsReady=false,latestLat=null,latestLng=null,detectedCampus=null,activeSession=null,timerInterval=null;

function haversine(lat1,lon1,lat2,lon2){
  const toRad=x=>x*Math.PI/180;
  const R=6371;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function onGPSSuccess(pos){
  latestLat=pos.coords.latitude;
  latestLng=pos.coords.longitude;
  gpsReady=true;
  
  detectedCampus=null;
  for(let c of campuses){
    const d=haversine(latestLat,latestLng,c.coords.lat,c.coords.lng);
    if(d<=c.radius){detectedCampus=c;break;}
  }
  
  updateButtonStates();
}

function onGPSError(err){
  gpsReady=false;
  updateButtonStates();
  if(err.code===1) setMsg('Location access denied. Please enable location.','err');
}

function startGPS(){
  if(!navigator.geolocation){
    setMsg('Your device does not support location services.','err');
    return;
  }
  navigator.geolocation.watchPosition(onGPSSuccess,onGPSError,{
    enableHighAccuracy:true,
    timeout:10000,
    maximumAge:5000
  });
}

/* UI */
const elId=document.getElementById('studentId');
const elName=document.getElementById('name');
const elTrainer=document.getElementById('trainer');
const elCourse=document.getElementById('course');
const elBtnCheckIn=document.getElementById('btnCheckIn');
const elBtnCheckOut=document.getElementById('btnCheckOut');
const elMsg=document.getElementById('msg');
const elSessionInfo=document.getElementById('sessionInfo');
const elSessionCheckIn=document.getElementById('sessionCheckIn');
const elSessionCampus=document.getElementById('sessionCampus');
const elTimeElapsed=document.getElementById('timeElapsed');

function setMsg(txt,cls){
  elMsg.textContent=txt;
  elMsg.className='msg '+cls;
}

function updateButtonStates(){
  const formValid = elId.value.trim() && elName.value.trim() && elTrainer.value && elCourse.value;
  const locationOk = gpsReady && detectedCampus;
  
  if(activeSession){
    elBtnCheckIn.disabled = true;
    elBtnCheckOut.disabled = !formValid || !gpsReady;
  }else{
    elBtnCheckIn.disabled = !formValid || !locationOk;
    elBtnCheckOut.disabled = true;
  }
}

/* Populate trainers */
const trainers = Object.keys(TRAINER_COURSES).sort();
trainers.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t;
  opt.textContent = t;
  elTrainer.appendChild(opt);
});

elTrainer.addEventListener('change', () => {
  const selected = elTrainer.value;
  elCourse.innerHTML = '<option value="">— Select course —</option>';
  
  if(selected && TRAINER_COURSES[selected]){
    TRAINER_COURSES[selected].forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      elCourse.appendChild(opt);
    });
  }
  
  updateButtonStates();
});

elId.addEventListener('input', updateButtonStates);
elName.addEventListener('input', updateButtonStates);
elCourse.addEventListener('change', updateButtonStates);

/* Session Management */
function loadActiveSession(){
  const saved = localStorage.getItem('activeSession');
  if(saved){
    try{
      activeSession = JSON.parse(saved);
      
      // Populate form with saved session data
      elId.value = activeSession.studentId;
      elName.value = activeSession.name;
      elTrainer.value = activeSession.trainer;
      
      // Trigger trainer change to populate courses
      elTrainer.dispatchEvent(new Event('change'));
      
      // Wait a moment for courses to populate, then set course
      setTimeout(()=>{
        elCourse.value = activeSession.course;
        updateButtonStates();
      }, 50);
      
      showSessionInfo();
      startTimer();
      setMsg('Active session resumed. Fill in your details and click "Check Out" when done.','info');
    }catch(e){
      localStorage.removeItem('activeSession');
    }
  }
}

function saveActiveSession(){
  localStorage.setItem('activeSession', JSON.stringify(activeSession));
}

function clearActiveSession(){
  localStorage.removeItem('activeSession');
  activeSession = null;
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function showSessionInfo(){
  elSessionInfo.classList.add('active');
  elSessionCampus.textContent = activeSession.campus;
  elSessionCheckIn.textContent = new Date(activeSession.checkInTime).toLocaleTimeString('en-AU', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  });
}

function hideSessionInfo(){
  elSessionInfo.classList.remove('active');
}

/* Timer */
function formatTime(seconds){
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  
  function updateTimer(){
    if(!activeSession) return;
    const elapsed = Math.floor((Date.now() - activeSession.checkInTime) / 1000);
    elTimeElapsed.textContent = formatTime(elapsed);
  }
  
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

/* Check In */
async function submitCheckIn(){
  const id=(elId.value||'').trim();
  const name=(elName.value||'').trim();
  const trainer=elTrainer.value;
  const course=elCourse.value;
  
  elMsg.style.display='none';
  
  if(!ID_REGEX.test(id)){setMsg('Please enter a valid Contact ID.','warn');return;}
  if(!gpsReady||latestLat===null||latestLng===null){setMsg('Kindly ensure your location is enabled. Try again.','warn');startGPS();return;}
  if(!detectedCampus){setMsg('You are not on campus.','err');return;}
  if(activeSession){setMsg('⚠️ You already have an active session. Please check out first.','warn');return;}

  elBtnCheckIn.disabled=true;
  elBtnCheckIn.textContent='Checking In…';
  
  try{
    const checkInTime = Date.now();
    const res=await fetch(CHECKIN_FLOW_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        StudentID:id,
        Name:name,
        Trainer:trainer,
        Course:course,
        Campus:detectedCampus.name,
        Latitude:latestLat,
        Longitude:latestLng,
        CheckInTime: new Date(checkInTime).toISOString()
      })
    });
    
    const data=await res.json().catch(()=>({}));
    
    if(res.ok){
      activeSession = {
        studentId: id,
        name: name,
        trainer: trainer,
        course: course,
        campus: detectedCampus.name,
        checkInTime: checkInTime,
        checkInLat: latestLat,
        checkInLng: latestLng
      };
      
      saveActiveSession();
      showSessionInfo();
      startTimer();
      updateButtonStates();
      setMsg('✅ Checked in successfully! Class time started.','ok');
    }else{
      setMsg('❌ '+(data.message||`Check-in failed (${res.status}).`),'err');
    }
  }catch(e){
    setMsg('❌ Network error. Please try again.','err');
  }finally{
    elBtnCheckIn.disabled=false;
    elBtnCheckIn.textContent='➜ Check In';
    updateButtonStates();
  }
}

/* Check Out */
async function submitCheckOut(){
  const id=(elId.value||'').trim();
  const name=(elName.value||'').trim();
  const trainer=elTrainer.value;
  const course=elCourse.value;
  
  if(!activeSession){
    setMsg('❌ No active session found. Please check in first.','err');
    return;
  }
  
  // Verify form data matches active session
  if(id.toUpperCase() !== activeSession.studentId.toUpperCase()){
    setMsg('❌ Contact ID does not match active session.','err');
    return;
  }
  
  elMsg.style.display='none';
  
  if(!gpsReady){
    setMsg('⚠️ Getting your location for checkout...','warn');
    startGPS();
    setTimeout(()=>{
      if(gpsReady) submitCheckOut();
    }, 2000);
    return;
  }
  
  elBtnCheckOut.disabled=true;
  elBtnCheckOut.textContent='Checking Out…';
  
  try{
    const checkOutTime = Date.now();
    const durationSeconds = Math.floor((checkOutTime - activeSession.checkInTime) / 1000);
    const durationMinutes = Math.floor(durationSeconds / 60);
    const hours = Math.floor(durationMinutes / 60);
    const minutes = durationMinutes % 60;
    const hoursDecimal = (durationMinutes / 60).toFixed(2);
    
    const res=await fetch(CHECKOUT_FLOW_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        StudentID: activeSession.studentId,
        Name: activeSession.name,
        Trainer: activeSession.trainer,
        Course: activeSession.course,
        Campus: activeSession.campus,
        CheckInTime: new Date(activeSession.checkInTime).toISOString(),
        CheckOutTime: new Date(checkOutTime).toISOString(),
        CheckInLatitude: activeSession.checkInLat,
        CheckInLongitude: activeSession.checkInLng,
        CheckOutLatitude: latestLat,
        CheckOutLongitude: latestLng,
        DurationSeconds: durationSeconds,
        DurationMinutes: durationMinutes,
        DurationFormatted: `${hours}h ${minutes}m`,
        Hours: hoursDecimal
      })
    });
    
    const data=await res.json().catch(()=>({}));
    
    if(res.ok){
      setMsg(`Checked out successfully! Total class time checked in: ${hours}h ${minutes}m`,'ok');
      clearActiveSession();
      hideSessionInfo();
      
      // Clear form
      elId.value = '';
      elName.value = '';
      elTrainer.value = '';
      elCourse.innerHTML = '<option value="">— Select course —</option>';
      
      updateButtonStates();
    }else{
      setMsg('❌ '+(data.message||`Check-out failed (${res.status}).`),'err');
    }
  }catch(e){
    setMsg('❌ Network error. Please try again.','err');
  }finally{
    elBtnCheckOut.disabled=false;
    elBtnCheckOut.textContent='✓ Check Out';
    updateButtonStates();
  }
}

/* Initialize */
startGPS();
loadActiveSession();
</script>
</body>
</html>
