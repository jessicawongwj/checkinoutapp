<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Attendance Check-In</title>
<style>
  :root{
    --brand:#2D1B4E; --brand-dark:#1F132F; --brand-light:#3D2B5E;
    --accent-gold:#D4AF37; --ok:#118a0a; --warn:#d97706; --err:#b91c1c;
    --checkout:#dc2626; --checkout-dark:#b91c1c;
  }
  *{box-sizing:border-box;}
  body{ margin:0;color:#111; font-family:system-ui,-apple-system,sans-serif; background:linear-gradient(135deg,#2D1B4E 0%,#3D2B5E 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .wrap{ width:100%; max-width:600px; }
  .card{ background:#fff; border-radius:16px; padding:28px 20px; box-shadow:0 18px 40px rgba(0,0,0,.25); border-top:4px solid var(--accent-gold); }
  h1{ margin:0 0 10px; font-size:26px; text-align:center; background:linear-gradient(90deg,#2D1B4E,#3D2B5E); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:800; }
  .muted{ color:#555; font-size:13px; margin:0 0 20px; text-align:center; }
  label{ display:block; margin:16px 0 8px; font-weight:600; color:#2D1B4E; }
  input,select,button{ width:100%; padding:14px 16px; border:1px solid #d8dee9; border-radius:12px; font-size:16px; }
  .button-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:24px; }
  .btn-checkin{ background:var(--brand); color:#fff; border:none; cursor:pointer; }
  .btn-checkout{ background:var(--checkout); color:#fff; border:none; cursor:pointer; }
  button:disabled{ background:#c4b8d3; cursor:not-allowed; }
  .msg{ margin-top:16px; padding:14px; border-radius:12px; font-size:14px; display:none; line-height:1.5; }
  .msg.ok{ display:block; background:#ecfdf5; color:var(--ok); border:1px solid #bbf7d0; }
  .msg.warn{ display:block; background:#fffbeb; color:var(--warn); border:1px solid #fde68a; }
  .msg.err{ display:block; background:#fef2f2; color:var(--err); border:1px solid #fecaca; }
  .session-info{ background:#f8f9fa; border-radius:12px; padding:16px; margin-top:16px; display:none; border-left:4px solid var(--accent-gold); }
  .session-info.active{ display:block; }
  .time-display{ text-align:center; font-size:32px; font-weight:800; color:var(--brand); margin-top:10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Attendance Check-In</h1>
      <p class="muted">Please ensure GPS is on. Data is only used for campus verification.</p>

      <form onsubmit="return false;">
        <label>Contact ID</label>
        <input id="studentId" inputmode="numeric" placeholder="e.g. 13579666" required />

        <label>Full Name</label>
        <input id="name" placeholder="e.g. Wilson So" required />

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label>Trainer</label>
            <select id="trainer" required><option value="">— Select —</option></select>
          </div>
          <div>
            <label>Course</label>
            <select id="course" required><option value="">— Select —</option></select>
          </div>
        </div>

        <div class="button-row">
          <button type="button" id="btnCheckIn" class="btn-checkin" disabled onclick="submitCheckIn()">➜ Check In</button>
          <button type="button" id="btnCheckOut" class="btn-checkout" disabled onclick="submitCheckOut()">✓ Check Out</button>
        </div>
      </form>

      <div id="sessionInfo" class="session-info">
        <div><strong>Active Session:</strong> <span id="sessionCampus"></span></div>
        <div id="timeElapsed" class="time-display">00:00:00</div>
      </div>

      <div id="msg" class="msg"></div>
    </div>
  </div>

<script>
const CHECKIN_URL = "https://default9d8868a5c1dc4786aff1f7d04646be.9a.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9ed041ac7ca143a0b262334d9dfc13d5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=il-cX-qHDZbGSxE2OnN56BK2jdJIgxWXFIStUm65G6g";
const CHECKOUT_URL = "https://default9d8868a5c1dc4786aff1f7d04646be.9a.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2e4266def4fe44618e9eddd28221178c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=NfMkFq1ITZSPcQNVmn6Ikt7OPS0NUA_Yp-Q9QP8TFoQ";

const TRAINER_COURSES = { /* ... 保持原本的資料內容 ... */ "Carlos Castellano": ["SIT30821 Certificate III in Commercial Cookery"], "Carol Ly": ["CHC43015 Certificate IV in Ageing Support", "CHC52021 Diploma of Community Services"], "Chloe BIAN": ["CHC30121 Certificate III in Early Childhood Education and Care"], "Marty Gray": ["BSB30120 Certificate III in Business", "BSB50120 Diploma of Business"] };

const campuses = [ {name:"Brisbane Campus", lat:-27.468, lng:153.024, radius:0.3} ];

let gpsReady=false, latestLat=null, latestLng=null, detectedCampus=null, activeSession=null, timerInterval=null;

function setMsg(txt, cls){
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg ' + cls;
  el.style.display = 'block';
}

/* GPS 處理 */
function onGPSSuccess(pos){
  latestLat = pos.coords.latitude;
  latestLng = pos.coords.longitude;
  gpsReady = true;
  detectedCampus = campuses.find(c => haversine(latestLat, latestLng, c.lat, c.lng) <= c.radius);
  
  if(!detectedCampus) setMsg("📍 You are not on campus. Check-in disabled.", "warn");
  else elMsg.style.display = 'none';
  updateButtonStates();
}

function onGPSError(err){
  gpsReady = false;
  updateButtonStates();
  let m = "GPS Error: ";
  if(err.code === 1) m += "Location access denied. Please enable GPS.";
  else if(err.code === 2) m += "Position unavailable.";
  else m += "Timeout.";
  setMsg(m, "err");
}

function startGPS(){
  if(!navigator.geolocation) return setMsg("Browser doesn't support GPS", "err");
  navigator.geolocation.watchPosition(onGPSSuccess, onGPSError, {enableHighAccuracy:true});
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* UI 邏輯 */
const elId=document.getElementById('studentId'), elName=document.getElementById('name'), elTrainer=document.getElementById('trainer'), elCourse=document.getElementById('course'), elBtnIn=document.getElementById('btnCheckIn'), elBtnOut=document.getElementById('btnCheckOut'), elMsg=document.getElementById('msg');

function updateButtonStates(){
  const filled = elId.value && elName.value && elTrainer.value && elCourse.value;
  if(activeSession){
    elBtnIn.disabled = true;
    elBtnOut.disabled = !gpsReady;
  } else {
    elBtnIn.disabled = !(filled && gpsReady && detectedCampus);
    elBtnOut.disabled = true;
  }
}

/* 初始化選單 */
Object.keys(TRAINER_COURSES).sort().forEach(t => {
  const opt = document.createElement('option'); opt.value = t; opt.textContent = t; elTrainer.appendChild(opt);
});

elTrainer.onchange = () => {
  elCourse.innerHTML = '<option value="">— Select —</option>';
  if(TRAINER_COURSES[elTrainer.value]) TRAINER_COURSES[elTrainer.value].forEach(c => {
    const opt = document.createElement('option'); opt.value = c; opt.textContent = c; elCourse.appendChild(opt);
  });
  updateButtonStates();
};
[elId, elName, elCourse].forEach(el => el.oninput = updateButtonStates);

/* 記憶功能 */
function autoFill(){
  if(activeSession) return;
  elId.value = localStorage.getItem('r_id') || '';
  elName.value = localStorage.getItem('r_name') || '';
  elTrainer.value = localStorage.getItem('r_trainer') || '';
  elTrainer.dispatchEvent(new Event('change'));
  setTimeout(() => { elCourse.value = localStorage.getItem('r_course') || ''; updateButtonStates(); }, 100);
}

/* 簽到提交 */
async function submitCheckIn(){
  setMsg("⏳ Connecting to server...", "info");
  try {
    const res = await fetch(CHECKIN_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ StudentID:elId.value, Name:elName.value, Trainer:elTrainer.value, Course:elCourse.value, Campus:detectedCampus.name, Lat:latestLat, Lng:latestLng, CheckInTime:new Date().toISOString() })
    });
    if(res.ok){
      localStorage.setItem('r_id', elId.value); localStorage.setItem('r_name', elName.value); localStorage.setItem('r_trainer', elTrainer.value); localStorage.setItem('r_course', elCourse.value);
      activeSession = { studentId: elId.value, campus: detectedCampus.name, checkInTime: Date.now() };
      localStorage.setItem('activeSession', JSON.stringify(activeSession));
      setMsg("✅ Check-in Success!", "ok");
      location.reload(); // 重新載入以更新 UI 狀態
    } else {
      setMsg(`❌ Error: Server returned ${res.status}. Please try again.`, "err");
    }
  } catch(e) { setMsg("❌ Network Error. Check your internet connection.", "err"); }
}

async function submitCheckOut(){
  setMsg("⏳ Processing Checkout...", "info");
  try {
    const res = await fetch(CHECKOUT_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ StudentID:activeSession.studentId, CheckOutTime:new Date().toISOString() })
    });
    if(res.ok){
      localStorage.removeItem('activeSession');
      setMsg("✅ Checkout Complete!", "ok");
      setTimeout(() => location.reload(), 2000);
    } else {
      setMsg(`❌ Checkout Failed (${res.status}).`, "err");
    }
  } catch(e) { setMsg("❌ Network Error during checkout.", "err"); }
}

/* 啟動 */
const saved = localStorage.getItem('activeSession');
if(saved) {
  activeSession = JSON.parse(saved);
  document.getElementById('sessionInfo').classList.add('active');
  document.getElementById('sessionCampus').textContent = activeSession.campus;
  setInterval(() => {
    const sec = Math.floor((Date.now() - activeSession.checkInTime)/1000);
    const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    document.getElementById('timeElapsed').textContent = `${h}:${m}:${s}`;
  }, 1000);
}
startGPS();
autoFill();
</script>
</body>
</html>
